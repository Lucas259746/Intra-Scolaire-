services:
  app:
    build: .
    container_name: symfony_app
    working_dir: /var/www/html
    command: ["sh", "-c", "mkdir -p public/uploads/documents && COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction && chown -R www-data:www-data var && chown www-data:www-data public/uploads/documents && exec php-fpm"]
    volumes:
      - ./app:/var/www/html
      - app_logs:/var/log/php
      - app_cache:/var/www/html/var
      - app_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - symfony_network

  webserver:
    image: nginx:stable
    container_name: symfony_webserver
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx:/etc/nginx/conf.d
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - symfony_network

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: symfony_db
    environment:
      POSTGRES_DB: symfony_db
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: symfony
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "symfony_db", "-U", "symfony"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data:rw
    networks:
      - symfony_network

  adminer:
    image: adminer
    container_name: symfony_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - database
    networks:
      - symfony_network

networks:
  symfony_network:
    driver: bridge

volumes:
  db_data:
  phpmyadmin_data:
  app_logs:
  app_cache:
  app_vendor:
  nginx_logs:
